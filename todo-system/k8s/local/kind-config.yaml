kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # The frontend nginx configuration uses the conventional kube-dns address.
  serviceSubnet: 10.96.0.0/12
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
