<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TODO system application and Kubernetes infrastructure</title>
  <desc id="desc">A hand-drawn style diagram showing a browser entering through the frontend, synchronous API calls to todo and activity services, asynchronous events through NATS, and persistent data in Postgres.</desc>
  <defs>
    <filter id="rough" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 L 2.5 5 Z" fill="#1b1b1f"/>
    </marker>
    <style>
      .canvas { fill: #fffefb; }
      .ink { stroke: #1b1b1f; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .box { filter: url(#rough); }
      .cluster { fill: none; stroke: #868e96; stroke-width: 2.5; stroke-dasharray: 12 9; }
      .deployment { fill: #f8f9fa; stroke: #868e96; stroke-width: 2; stroke-dasharray: 8 7; }
      .service { fill: #d0ebff; }
      .frontend { fill: #d3f9d8; }
      .application { fill: #e5dbff; }
      .broker { fill: #fff3bf; }
      .database { fill: #ffe3e3; }
      .storage { fill: #ffd8a8; }
      .title { font: 700 28px "Virgil", "Comic Sans MS", cursive; fill: #1b1b1f; }
      .section { font: 700 20px "Virgil", "Comic Sans MS", cursive; fill: #495057; }
      .label { font: 700 18px "Virgil", "Comic Sans MS", cursive; fill: #1b1b1f; text-anchor: middle; }
      .small { font: 15px "Virgil", "Comic Sans MS", cursive; fill: #343a40; text-anchor: middle; }
      .tiny { font: 13px "Virgil", "Comic Sans MS", cursive; fill: #495057; text-anchor: middle; }
      .flow { fill: none; stroke: #1b1b1f; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .event { fill: none; stroke: #e67700; stroke-width: 2.8; stroke-dasharray: 9 7; stroke-linecap: round; marker-end: url(#arrow); }
      .data { fill: none; stroke: #c92a2a; stroke-width: 2.6; stroke-linecap: round; marker-end: url(#arrow); }
      .note { font: 14px "Virgil", "Comic Sans MS", cursive; fill: #495057; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="900"/>
  <text class="title" x="800" y="40" text-anchor="middle">TODO system — application + Kubernetes runtime</text>

  <!-- User -->
  <g class="box">
    <rect class="ink" x="24" y="355" width="120" height="95" rx="18" fill="#ffffff"/>
    <path class="ink" d="M45 379 H123 V421 H45 Z M45 390 H123" fill="#e7f5ff"/>
    <circle cx="53" cy="385" r="2.5" fill="#1b1b1f"/>
    <circle cx="61" cy="385" r="2.5" fill="#1b1b1f"/>
  </g>
  <text class="label" x="84" y="476">Browser</text>

  <!-- Kubernetes boundary -->
  <rect class="cluster box" x="175" y="72" width="1395" height="775" rx="28"/>
  <rect x="205" y="57" width="310" height="34" rx="10" fill="#fffefb"/>
  <text class="section" x="220" y="81">Kubernetes namespace: todo</text>

  <!-- Frontend service and deployment -->
  <g class="box">
    <rect class="ink service" x="215" y="350" width="145" height="90" rx="18"/>
    <path class="ink" d="M237 379 C250 363 272 363 283 379 C296 365 320 370 320 390 C320 407 304 414 282 414 H250 C226 414 224 390 237 379 Z" fill="#a5d8ff"/>
  </g>
  <text class="label" x="287" y="463">frontend Service</text>
  <text class="tiny" x="287" y="485">NodePort :30080</text>

  <g class="box">
    <rect class="deployment" x="405" y="270" width="220" height="245" rx="20"/>
    <text class="label" x="515" y="302">frontend Deployment</text>
    <rect class="ink frontend" x="435" y="330" width="160" height="67" rx="15"/>
    <text class="small" x="515" y="360">nginx + React</text>
    <text class="tiny" x="515" y="382">Pod 1</text>
    <rect class="ink frontend" x="435" y="420" width="160" height="67" rx="15"/>
    <text class="small" x="515" y="450">nginx + React</text>
    <text class="tiny" x="515" y="472">Pod 2</text>
  </g>

  <!-- Todo Service and Deployment -->
  <g class="box">
    <rect class="ink service" x="680" y="165" width="150" height="72" rx="18"/>
    <text class="label" x="755" y="196">todo-service</text>
    <text class="tiny" x="755" y="219">Service :8080</text>
  </g>
  <g class="box">
    <rect class="deployment" x="875" y="105" width="220" height="195" rx="20"/>
    <text class="label" x="985" y="138">todo Deployment</text>
    <rect class="ink application" x="905" y="160" width="160" height="50" rx="14"/>
    <text class="small" x="985" y="191">Spring Boot Pod</text>
    <rect class="ink application" x="905" y="230" width="160" height="50" rx="14"/>
    <text class="small" x="985" y="261">Spring Boot Pod</text>
  </g>

  <!-- Activity Service and Deployment -->
  <g class="box">
    <rect class="ink service" x="680" y="600" width="150" height="72" rx="18"/>
    <text class="label" x="755" y="631">activity</text>
    <text class="tiny" x="755" y="654">Service :8080</text>
  </g>
  <g class="box">
    <rect class="deployment" x="875" y="540" width="220" height="195" rx="20"/>
    <text class="label" x="985" y="573">activity Deployment</text>
    <rect class="ink application" x="905" y="595" width="160" height="50" rx="14"/>
    <text class="small" x="985" y="626">Spring Boot Pod</text>
    <rect class="ink application" x="905" y="665" width="160" height="50" rx="14"/>
    <text class="small" x="985" y="696">Spring Boot Pod</text>
  </g>

  <!-- NATS -->
  <g class="box">
    <rect class="ink service" x="870" y="365" width="128" height="66" rx="17"/>
    <text class="label" x="934" y="395">NATS</text>
    <text class="tiny" x="934" y="416">Service :4222</text>
    <rect class="deployment broker" x="1030" y="345" width="145" height="108" rx="20"/>
    <text class="label" x="1102" y="380">NATS</text>
    <text class="small" x="1102" y="406">broker Pod</text>
    <text class="tiny" x="1102" y="431">Deployment</text>
  </g>

  <!-- Postgres -->
  <g class="box">
    <rect class="ink service" x="1195" y="235" width="145" height="72" rx="18"/>
    <text class="label" x="1267" y="266">Postgres</text>
    <text class="tiny" x="1267" y="289">Service :5432</text>
    <rect class="deployment database" x="1380" y="180" width="155" height="215" rx="22"/>
    <text class="label" x="1457" y="215">Postgres</text>
    <ellipse class="ink" cx="1457" cy="255" rx="48" ry="14" fill="#ffc9c9"/>
    <path class="ink" d="M1409 255 V321 C1409 339 1505 339 1505 321 V255" fill="#ffc9c9"/>
    <path class="ink" d="M1409 287 C1409 304 1505 304 1505 287" fill="none"/>
    <text class="tiny" x="1457" y="358">StatefulSet</text>
    <text class="tiny" x="1457" y="379">todo + activity DBs</text>
  </g>
  <g class="box">
    <path class="ink storage" d="M1387 455 H1527 L1515 522 H1399 Z"/>
    <text class="label" x="1457" y="486">PVC</text>
    <text class="tiny" x="1457" y="509">persistent data</text>
  </g>

  <!-- Request flows -->
  <path class="flow" d="M145 402 C170 401 186 399 212 398"/>
  <text class="note" x="153" y="383">HTTP</text>
  <path class="flow" d="M362 395 C380 394 389 393 403 393"/>
  <path class="flow" d="M625 350 C650 321 650 208 677 204"/>
  <text class="note" x="634" y="273">/api/todos</text>
  <path class="flow" d="M625 438 C654 466 650 629 677 634"/>
  <text class="note" x="631" y="532">/api/activity</text>
  <path class="flow" d="M832 201 C847 201 858 201 872 201"/>
  <path class="flow" d="M832 636 C847 636 858 636 872 636"/>

  <!-- Events -->
  <path class="event" d="M985 302 C985 328 960 344 945 363"/>
  <text class="note" x="1000" y="330">publish todo.*</text>
  <path class="flow" d="M1000 398 C1010 398 1018 398 1028 398"/>
  <path class="event" d="M934 433 C934 467 973 492 984 537"/>
  <text class="note" x="948" y="487">queue subscription</text>

  <!-- Database flows -->
  <path class="data" d="M1097 190 C1135 190 1155 256 1192 268"/>
  <text class="note" x="1125" y="214">JPA</text>
  <path class="data" d="M1096 632 C1158 620 1155 326 1234 309"/>
  <text class="note" x="1137" y="581">JPA</text>
  <path class="data" d="M1342 271 C1353 271 1363 271 1377 271"/>
  <path class="data" d="M1457 397 C1457 417 1457 433 1457 452"/>

  <!-- Legend -->
  <g transform="translate(210 785)">
    <path class="flow" d="M0 0 H62"/>
    <text class="note" x="74" y="5">HTTP / service traffic</text>
    <path class="event" d="M280 0 H342"/>
    <text class="note" x="354" y="5">asynchronous CloudEvents</text>
    <path class="data" d="M600 0 H662"/>
    <text class="note" x="674" y="5">database traffic / storage</text>
  </g>
</svg>

